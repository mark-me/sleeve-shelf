# Sleeve & Shelf — production: a released version.
#
#   docker compose -f docker-compose.yml up -d
#
# Then open http://<host>:5000

services:
  sleeve-shelf:
    # Pin the release you want to run; see the published versions at
    # https://github.com/mark-me/sleeve-shelf/pkgs/container/sleeve-shelf
    image: ghcr.io/mark-me/sleeve-shelf:0.1.0
    container_name: sleeve-shelf
    restart: unless-stopped
    # Shielded: nothing but /data (and /tmp, in memory) can be written, the app gains no
    # privileges and has none of root's, and it gets a bounded share of the machine. Should
    # anyone ever break in, there is little they can do. It uses about 75 MB.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 200
    ports:
      - "5000:5000"
    environment:
      # Behind Tailscale Funnel or a reverse proxy: the one proxy that may say who a visitor
      # is. Leave it out when the app is reached directly.
      SLEEVE_SHELF_PROXIES: "1"
    volumes:
      # The collection (JSON files) lives here and survives upgrades.
      - sleeve-shelf-data:/data

volumes:
  sleeve-shelf-data:
