# Sleeve & Shelf — the latest build of the test branch, for trying changes out.
#
#   docker compose -f docker-compose.test.yml up -d
#
# Then open http://<host>:5001
#
# Uses its own port, container name, and volume, so it runs next to the
# production container (docker-compose.yml) without touching its data.

services:
  sleeve-shelf-test:
    image: ghcr.io/mark-me/sleeve-shelf:test
    # The :test tag moves with every push, so fetch it again on each start.
    pull_policy: always
    container_name: sleeve-shelf-test
    restart: unless-stopped
    # Shielded: nothing but /data (and /tmp, in memory) can be written, the app gains no
    # privileges and has none of root's, and it gets a bounded share of the machine. Should
    # anyone ever break in, there is little they can do. It uses about 75 MB.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 200
    ports:
      - "5001:5000"
    environment:
      # Behind Tailscale Funnel or a reverse proxy: the one proxy that may say who a visitor
      # is. Leave it out when the app is reached directly.
      SLEEVE_SHELF_PROXIES: "1"
    volumes:
      - sleeve-shelf-test-data:/data

volumes:
  sleeve-shelf-test-data:
