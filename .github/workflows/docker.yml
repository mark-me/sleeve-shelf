name: Build & Push Docker Image

on:
  push:
    branches: [ main, test ]
    tags: [ 'v*.*.*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run tests
        run: uv run --locked python -m pytest

  # The packages are checked for known vulnerabilities; a dangerous one stops the image.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-and-push:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the branch name (:main or :test), the release version for a
      # v*.*.* tag, the short commit SHA, and :latest for main only.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Sleeve & Shelf
            org.opencontainers.image.description=Organizes a vinyl record collection across cabinets and shelves (amd64, arm64)
            org.opencontainers.image.vendor=mark-me
          annotations: |
            org.opencontainers.image.title=Sleeve & Shelf
            org.opencontainers.image.description=Organizes a vinyl record collection across cabinets and shelves (amd64, arm64)
            org.opencontainers.image.vendor=mark-me

      - name: Compute version for APP_VERSION
        id: version
        run: |
          # A release tag like v1.2.3
          if [[ "$GITHUB_REF" == refs/tags/v*.*.* ]]; then
            VERSION=${GITHUB_REF_NAME#v}

          # Main: the latest release plus how far main is ahead of it
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            BASE_VERSION=${LATEST_TAG#v}
            COMMIT_DISTANCE=$(git rev-list --count "${LATEST_TAG}..HEAD" 2>/dev/null || git rev-list --count HEAD)
            if [ "$COMMIT_DISTANCE" -eq 0 ]; then
              VERSION=${BASE_VERSION}
            else
              VERSION="${BASE_VERSION}+main.${COMMIT_DISTANCE}.$(git rev-parse --short=8 HEAD)"
            fi

          # Test branch
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            VERSION="${LATEST_TAG#v}+test.$(git rev-parse --short=8 HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine build platforms
        id: platforms
        run: |
          # Test branch: amd64 only for faster builds
          # Main and tags: multi-architecture build (amd64, arm64)
          if [[ "$GITHUB_REF" == refs/heads/test ]]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
