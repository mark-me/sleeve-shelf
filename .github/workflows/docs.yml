name: Publish documentation

# The documentation site (docs-site/) is built with Zensical and published to GitHub Pages
# from main. It can also be published by hand from the Actions tab.
on:
  push:
    branches: [ main ]
    paths:
      - "docs-site/**"
      - "docs/requirements.md"
      - "tests/test_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# One publication at a time; a newer push replaces one that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The site's own conventions: an emoji per level-2 heading, the navigation, the
      # data-model diagram matching the requirements.
      - name: Check the documentation
        run: uv run --locked python -m pytest tests/test_docs.py

      - name: Build the site
        working-directory: docs-site
        run: uv run --locked python -m zensical build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
