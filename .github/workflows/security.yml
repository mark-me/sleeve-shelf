name: Security scan

# Checks the Python packages the app runs on (uv.lock) for known vulnerabilities, with Trivy.
# A HIGH or CRITICAL vulnerability that has a fix fails the run; the full list, every
# severity, is always in the log. The Docker workflow calls this scan too, and builds no
# image when it fails. It also runs weekly: new vulnerabilities are found in packages that
# did not change.
on:
  pull_request:
  push:
    # main and test are scanned by the Docker workflow, which calls this one.
    branches-ignore: [main, test]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to a commit rather than a tag: a tag can be moved to other code afterwards.
      - name: List every known vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: uv.lock
          scanners: vuln
          format: table
          exit-code: "0"

      - name: Fail on a HIGH or CRITICAL vulnerability that has a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: uv.lock
          scanners: vuln
          severity: HIGH,CRITICAL
          # One without a fix cannot be resolved by updating; it is listed above.
          ignore-unfixed: true
          format: table
          exit-code: "1"
