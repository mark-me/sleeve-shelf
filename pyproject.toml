[project]
name = "sleeve-shelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Zwart", email = "mark.zwart@pobox.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "openpyxl>=3.1.5",
    "pillow>=13",
    "pyyaml>=6.0.3",
    "waitress>=3.0.2",
]

[project.scripts]
sleeve-shelf = "sleeve_shelf.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=9.1.1",
    "zensical>=0.0.63",
]

[tool.ruff.lint]
# Unused and undefined names. Complexity (C901) is not checked yet: some functions are still too long.
select = ["F"]
