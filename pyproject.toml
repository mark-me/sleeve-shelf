[project]
name = "sleeve-shelf"
version = "0.1.0"
description = "Organises a vinyl collection across cabinets and shelves: browse and search it in shelf order, link it to Discogs, and sort it."
readme = "README.md"
authors = [
    { name = "Mark Zwart", email = "mark.zwart@pobox.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "openpyxl>=3.1.5",
    "pillow>=13",
    "pyyaml>=6.0.3",
    "waitress>=3.0.2",
]

[project.scripts]
sleeve-shelf = "sleeve_shelf.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=9.1.1",
    "zensical>=0.0.63",
    "mkdocstrings-python>=2.0.10",
]

[tool.ruff.lint]
# Unused and undefined names, and docstrings. Complexity (C901) is not checked yet: some functions are still too long.
select = ["F", "D"]
# A class says what its __init__ takes, as the Google style has it.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The name of a test says what it checks.
"tests/*" = ["D101", "D102", "D103", "D205", "D212", "D415"]
