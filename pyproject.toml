[project]
name = "sleeve-shelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Zwart", email = "mark.zwart@pobox.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "waitress>=3.0.2",
]

[project.scripts]
sleeve-shelf = "sleeve_shelf:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "zensical>=0.0.63",
]
